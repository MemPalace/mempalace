# Only the commit stage runs through pre-commit. The pre-push stage is the quick
# check in commonplace/guards/prepush.py (lint, format, docs-check and mapped fast
# tests inside a time budget). Install both hooks with
#   python -m commonplace.guards.hooks install
# not `pre-commit install`, whose hook breaks in linked worktrees.
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this rev in lock-step with the exact ruff pin in pyproject.toml
    # ([project.optional-dependencies].dev / [dependency-groups].dev) and
    # .github/workflows/ci.yml. A different ruff here produces different
    # formatter output than CI and breaks `ruff format --check` in lint.
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: docs-check
        name: docs-check (manual; the test suite runs it too)
        entry: python3 -m commonplace orch docs-check --base origin/develop --head HEAD
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
