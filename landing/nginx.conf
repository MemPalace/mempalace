# commonplace-site: nginx server blocks for commonplace.run and cmmn.dev.
# The landing/ folder is mounted as /etc/nginx/conf.d in an nginx:alpine container,
# with landing/public at /usr/share/nginx/html. See DEPLOY.md.
# TLS ends at Nginx Proxy Manager; this container only speaks plain HTTP.

# cmmn.dev short links. Unknown names go to the home page.
map $uri $short_link {
    default                      https://commonplace.run/;
    ~^/gh/?$                     https://github.com/140er/mempalace;
    ~^/mempalace/?$              https://github.com/MemPalace/mempalace;
    ~^/install/?$                https://commonplace.run/#install;
    ~^/connect/?$                https://commonplace.run/connect/;
    ~^/claude/?$                 https://commonplace.run/connect/#claude-code;
    ~^/codex/?$                  https://commonplace.run/connect/#codex;
    ~^/cursor/?$                 https://commonplace.run/connect/#cursor;
    ~^/antigravity/?$            https://commonplace.run/connect/#antigravity;
    ~^/cloud/?$                  https://commonplace.run/connect/#cloud;
    ~^/local/?$                  https://commonplace.run/connect/#local;
}

server {
    listen 80 default_server;
    server_name commonplace.run;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    # Same policy as the pages' meta tag: nothing loads from anywhere else.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Serve canonical legal links directly, with or without a trailing slash.
    location ~ ^/(privacy|terms)(/nl)?/?$ {
        try_files $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg)$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

server {
    listen 80;
    server_name www.commonplace.run;
    return 301 https://commonplace.run$request_uri;
}

server {
    listen 80;
    server_name cmmn.dev www.cmmn.dev;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;

    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ~ ^/(privacy|terms)(/nl)?/?$ {
        try_files $uri/index.html =404;
    }
    location = /legal.css {
        try_files $uri =404;
    }
    location = /favicon.svg {
        try_files $uri =404;
    }
    location / {
        return 302 $short_link;
    }
}
