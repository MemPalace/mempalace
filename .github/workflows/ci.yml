name: Tests

on:
  push:
    branches: [main, develop]
  # Every PR, so a PR stacked on another feature branch is tested too.
  pull_request:

# A push to a PR branch cancels the run its previous push started: the
# earlier commit is no longer what would be merged, and the full matrix is
# about 27 runner-minutes. Pushes to develop and main keep every run, so
# each merge has its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      # Gate is [tool.coverage.report] fail_under in pyproject.toml.
      # Do not pass --cov-fail-under.
      # -n auto runs one worker per CPU; --dist loadfile keeps a module's tests
      # on one worker, which is what the module-scoped fixtures and the
      # autouse state resets in tests/conftest.py assume. pytest-cov combines
      # the workers' coverage before the gate is applied.
      - run: python -m pytest tests/ -v --ignore=tests/benchmarks -n auto --dist loadfile --cov=mempalace --cov-report=term-missing --durations=25

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: 'pip'
      - run: pip install -e ".[dev]"
      # ChromaDB's rust HNSW core intermittently fails compaction or reader
      # initialization on Windows ("Failed to apply logs to the hnsw segment
      # writer" / "Error creating hnsw segment reader: Nothing found on disk")
      # regardless of our code — long-standing, non-reproducible-on-Linux/macOS
      # flakes. Retry ONLY those specific transient errors (via --only-rerun) so real,
      # deterministic failures still fail on the first run. Linux/macOS jobs
      # deliberately run with no reruns so genuine regressions surface there.
      # Same pyproject gate as Linux. tests/coverage_gate.py switches Windows
      # to [tool.mempalace.coverage] fail_under_windows.
      # The runner's TEMP is on the OS disk; runner.temp is on the local
      # scratch disk, the faster of the two. Every palace a test builds goes
      # under pytest's tmp_path, which follows TEMP.
      - run: >-
          python -m pytest tests/ -v --ignore=tests/benchmarks -n auto --dist loadfile
          --cov=mempalace --cov-report=term-missing --durations=25 --reruns 2
          --reruns-delay 5 --only-rerun
          "Failed to apply logs to the hnsw segment writer|Error creating hnsw segment reader: Nothing found on disk"
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -v --ignore=tests/benchmarks -n auto --dist loadfile --cov=mempalace --cov-report=term-missing --durations=25

  test-milvus:
    name: Measure Milvus extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: 'pip'
      # backends/milvus.py is omitted from the default gate (pymilvus is not
      # a dev dependency). This job measures that module. The package
      # threshold stays in pyproject.toml and is not restated here.
      # Pin the extra: milvus-lite 3.2 and pymilvus 3.0.2 fail this suite.
      - run: pip install -e ".[dev,milvus]" "pymilvus==3.0.0" "milvus-lite==3.0"
      - run: >-
          python -m pytest tests/test_milvus_backend.py -v
          --cov
          --cov-report=term-missing
          --cov-config=.github/coverage-milvus.toml
          --durations=10

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: 'pip'
      # Keep this pin identical to the `ruff==` pin in pyproject.toml
      # ([project.optional-dependencies].dev and [dependency-groups].dev)
      # so CI and `pip install -e ".[dev]"` format/lint identically.
      # This drifted once (CI on 0.15.14 against pyproject's 0.15.20) and the
      # drift was invisible: the lint job never installs from pyproject, so a
      # dependabot bump to the pin there passes CI without the new version
      # ever running. test_ruff_pins_match asserts the two stay equal, and
      # also covers the pre-commit config's ruff rev (all three must agree).
      - run: pip install "ruff==0.16.6"
      - run: ruff check .
      - run: ruff format --check .

  test-rust:
    name: Test Rust Core & CLI
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: cargo fmt --all --check
      - name: Clippy (warnings fail the job)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo check --workspace --locked
      - run: cargo test -p mempalace-core -p mempalace-cli --locked
      - run: pip install -e ".[dev]" "maturin>=1.7,<2"
      - name: Build and install native wheel
        run: pip install ./crates/mempalace-py
      - name: Verify native adapter (fallback cannot satisfy this job)
        env:
          MEMPALACE_REQUIRE_NATIVE: "1"
        run: >-
          python -m pytest tests/test_rust_exact_backend.py
          tests/test_backend_conformance.py tests/test_sqlite_exact_backend.py -v


