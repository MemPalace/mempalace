[workspace]
members = [
    "crates/mempalace-core",
    "crates/mempalace-py",
    "crates/mempalace-cli",
]
resolver = "2"

[workspace.package]
version = "3.9.0"
edition = "2021"
license = "MIT"
authors = ["mempalace contributors"]
repository = "https://github.com/MemPalace/mempalace"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
